name: Update subscriptions

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-subscriptions
  cancel-in-progress: false

jobs:
  update:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 60
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git remote remove origin 2>/dev/null || true
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3 4 5 6; do
            if git fetch -q --depth 1 origin "$GITHUB_SHA" && git checkout -q FETCH_HEAD; then
              echo "checkout ok (attempt $i)"
              break
            fi
            echo "checkout attempt $i failed, retrying..."
            sleep 15
          done
          git rev-parse HEAD

      - name: Commit new subscriptions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            node src/index.js && break
            echo "index attempt $i failed, retrying..."
            sleep 20
          done
          git add subscriptions
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh subscriptions"
            for i in 1 2 3 4 5; do
              git push origin main && exit 0
              git fetch origin main
              git rebase origin/main || git rebase --abort
              sleep 10
            done
            exit 1
          fi
