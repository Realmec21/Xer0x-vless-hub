name: Update subscriptions

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-subscriptions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore geo cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: geo-cache-${{ github.run_id }}
          restore-keys: |
            geo-cache-

      - name: Run collector
        run: node src/index.js

      - name: Commit new subscriptions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscriptions
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh subscriptions"
            git push
          fi
