<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xer0x-vless-hub</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--yellow:#d29922;--red:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);padding:20px;max-width:1100px;margin:0 auto}
h1{font-size:1.6em;margin-bottom:4px}
h2{font-size:1.1em;margin:24px 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.sub{color:var(--muted);margin-bottom:24px;font-size:.9em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px}
.card .num{font-size:1.8em;font-weight:700;color:var(--accent)}
.card .lbl{font-size:.8em;color:var(--muted);margin-top:4px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.links a{display:inline-block;padding:8px 16px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--accent);text-decoration:none;font-size:.9em;transition:border-color .15s}
.links a:hover{border-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:.85em}
th{background:var(--card);padding:10px 8px;text-align:left;color:var(--muted);font-weight:600;border-bottom:2px solid var(--border);position:sticky;top:0}
td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:rgba(88,166,255,.05)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.8em;font-weight:600}
.badge-fast{background:rgba(63,185,80,.15);color:var(--green)}
.badge-white{background:rgba(88,166,255,.15);color:var(--accent)}
.badge-speed{background:rgba(210,153,34,.15);color:var(--yellow)}
.country{display:inline-flex;align-items:center;gap:4px}
.uptime{font-family:monospace}
.uptime-hi{color:var(--green)}
.uptime-lo{color:var(--red)}
.mono{font-family:monospace;font-size:.9em}
.scroll{overflow-x:auto;border:1px solid var(--border);border-radius:8px}
#loading{color:var(--muted);padding:40px;text-align:center}
footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--border);color:var(--muted);font-size:.8em}
</style>
</head>
<body>
<h1>Xer0x-vless-hub</h1>
<p class="sub">Auto-collected &amp; validated VLESS profiles · обновляется раз в сутки</p>

<div class="cards" id="cards"><div id="loading">Loading report…</div></div>

<h2>Подписки</h2>
<div class="links">
  <a href="https://raw.githubusercontent.com/Realmec21/Xer0x-vless-hub/main/subscriptions/fast.txt" target="_blank">⚡ fast.txt</a>
  <a href="https://raw.githubusercontent.com/Realmec21/Xer0x-vless-hub/main/subscriptions/whitelist.txt" target="_blank">🇺🇸 whitelist.txt</a>
  <a href="https://raw.githubusercontent.com/Realmec21/Xer0x-vless-hub/main/subscriptions/blacklist.txt" target="_blank">🔴 blacklist.txt</a>
  <a href="https://raw.githubusercontent.com/Realmec21/Xer0x-vless-hub/main/subscriptions/clash.yaml" target="_blank">Clash YAML</a>
  <a href="https://raw.githubusercontent.com/Realmec21/Xer0x-vless-hub/main/subscriptions/sing-box.json" target="_blank">sing-box JSON</a>
  <a href="https://raw.githubusercontent.com/Realmec21/Xer0x-vless-hub/main/subscriptions/report.json" target="_blank">report.json</a>
</div>

<h2>Топ страны</h2>
<div class="cards" id="countries"></div>

<h2>Профили</h2>
<div class="scroll">
<table id="tbl">
<thead><tr><th>#</th><th>Страна</th><th>Сервер</th><th>Тип</th><th>Задержка</th><th>Скорость</th><th>Uptime</th><th>Статус</th></tr></thead>
<tbody></tbody>
</table>
</div>

<footer id="footer"></footer>

<script>
async function init(){
try{
const r=await fetch('https://raw.githubusercontent.com/Realmec21/Xer0x-vless-hub/main/subscriptions/report.json');
const d=await r.json();
const t=d.totals;
document.getElementById('cards').innerHTML=[
n(t.validated,'живых'),n(t.fast,'⚡ fast'),n(t.whitelist,'whitelist'),n(t.blacklist,'blacklist'),
n(t.avg_latency_ms,'мс (avg)'),n(t.avg_speed_mbps,'Mbps (avg)'),
n(t.unique,'уникальных'),n(t.fetched,'скачано')
].join('');
document.getElementById('countries').innerHTML=(d.top_countries||[]).map(c=>
  '<div class="card"><div class="num">'+c.cc+'</div><div class="lbl">'+c.count+' проф.</div></div>'
).join('');
const tb=document.querySelector('#tbl tbody');
tb.innerHTML=(d.profiles||[]).map(p=>{
  const u=p.uptime;
  const uCls=u>=80?'uptime-hi':u>=50?'':'uptime-lo';
  const badges=[
    p.fast?'<span class="badge badge-fast">⚡ fast</span>':'',
    p.whitelist?'<span class="badge badge-white">whitelist</span>':'',
    p.speed_mbps?'<span class="badge badge-speed">'+p.speed_mbps+' Mbps</span>':''
  ].filter(Boolean).join(' ');
  return '<tr><td>'+p.idx+'</td>'+
    '<td class="country">'+flag(p.server_cc)+' '+(p.server_cc||'?')+'</td>'+
    '<td class="mono">'+esc(p.host)+':'+p.port+'</td>'+
    '<td>'+esc(p.type)+(p.security!=='none'?' ('+esc(p.security)+')':'')+'</td>'+
    '<td>'+p.latency_ms+' мс</td>'+
    '<td>'+(p.speed_mbps?p.speed_mbps+' Mbps':'—')+'</td>'+
    '<td class="uptime '+uCls+'">'+(u!==null?u+'%':'—')+'</td>'+
    '<td>'+badges+'</td></tr>';
}).join('');
document.getElementById('footer').textContent='Generated: '+d.generated_at;
document.getElementById('loading')?.remove();
}catch(e){document.getElementById('loading').textContent='Failed to load report.json';}
}
function n(v,l){return '<div class="card"><div class="num">'+(v??'—')+'</div><div class="lbl">'+l+'</div></div>'}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function flag(cc){if(!cc||cc.length!==2)return'🌐';const A=0x1F1E6;cc=cc.toUpperCase();return String.fromCodePoint(A+cc.charCodeAt(0)-65,A+cc.charCodeAt(1)-65)}
init();
</script>
</body>
</html>
